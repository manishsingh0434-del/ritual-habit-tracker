<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ritual</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ritual" />
<meta name="theme-color" content="#0B0C10" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0C10'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%236C8EFF' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23F2C078'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0C10'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%236C8EFF' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23F2C078'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0B0C10; --surface:#14151C; --line:#23252F; --line2:#1C1E27;
    --ink:#F1EEE6; --inkDim:#8A8C99; --inkFaint:#565863;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Rounded","SF Pro Rounded",system-ui,sans-serif;
    overscroll-behavior:none;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  #app{max-width:460px; margin:0 auto; padding:28px 18px 110px; min-height:100vh;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .title{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
  .badge{font-size:11px; padding:5px 10px; border-radius:999px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .pill{display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    font-size:12px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--inkDim); cursor:pointer;}
  .pill.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .card{background:var(--surface); border-radius:18px; padding:18px; margin-bottom:14px; position:relative;}
  .card-head{display:flex; align-items:center; justify-content:space-between;}
  .habit-info{display:flex; align-items:center; gap:12px;}
  .icon-box{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .habit-name{font-weight:700; font-size:15px;}
  .streak{font-size:11px; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .iconbtn{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--inkDim); cursor:pointer; font-size:15px;}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:16px;}
  .day{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; padding:0;}
  .wd{font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--inkDim);}
  .dot{width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--ink); border:1.5px solid var(--line); transition:transform .1s;}
  .dot:active{transform:scale(0.9);}
  .yeargrid{margin-top:16px; overflow-x:auto; padding-bottom:4px;}
  .yeargrid .grid-inner{display:inline-grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px;}
  .cell{width:11px; height:11px; border-radius:2px; background:var(--line2);}
  .empty{text-align:center; padding:60px 20px; border-radius:18px; background:var(--surface); border:1px dashed var(--line); color:var(--inkDim); font-size:14px;}
  .btn-primary{background:var(--ink); color:var(--bg); border:none; border-radius:999px; padding:10px 18px; font-size:12px; font-weight:700; cursor:pointer;}
  .fab{position:fixed; bottom:96px; right:22px; width:56px; height:56px; border-radius:999px; background:var(--ink); color:var(--bg);
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:40;}
  .navbar{position:fixed; bottom:0; left:0; right:0; background:rgba(11,12,16,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line2); display:flex; justify-content:center; z-index:30;}
  .navinner{max-width:460px; width:100%; display:flex; padding:10px 28px calc(10px + env(safe-area-inset-bottom));}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--inkFaint); font-size:11px;}
  .navbtn.active{color:var(--ink);}
  .navicon{font-size:19px;}
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--line); border-radius:24px 24px 0 0; padding:24px; padding-bottom:36px;}
  .sheet input{width:100%; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--ink); font-size:14px; margin-bottom:18px; outline:none;}
  .label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--inkDim); margin-bottom:6px;}
  .icongrid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:18px;}
  .icon-choice{aspect-ratio:1; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:17px;
    background:var(--bg); border:1.5px solid var(--line); color:var(--inkDim); cursor:pointer;}
  .icon-choice.sel{border-color:currentColor;}
  .colorrow{display:flex; gap:10px; margin-bottom:22px;}
  .swatch{width:34px; height:34px; border-radius:999px; border:none; cursor:pointer;}
  /* pomodoro */
  .pomo-wrap{display:flex; flex-direction:column; align-items:center; padding-top:24px;}
  .pomo-title{font-size:22px; font-weight:800; margin-bottom:2px;}
  .pomo-sub{font-size:13px; color:var(--inkDim); margin-bottom:20px; text-align:center;}
  .pomo-input{width:100%; max-width:280px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; color:var(--ink); font-size:14px; text-align:center; margin-bottom:28px; outline:none;}
  .ring{position:relative; width:220px; height:220px; border-radius:999px; display:flex; align-items:center; justify-content:center; margin-bottom:28px;}
  .ring-inner{position:absolute; width:85%; height:85%; border-radius:999px; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-time{font-size:36px; font-weight:700;}
  .ring-status{font-size:12px; color:var(--inkDim); margin-top:4px;}
  .durrow{display:flex; gap:8px; margin-bottom:28px;}
  .dur{padding:9px 15px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;}
  .controls{display:flex; align-items:center; gap:16px;}
  .ctrl-side{width:44px; height:44px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--inkDim); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ctrl-main{width:64px; height:64px; border-radius:999px; background:#F2C078; color:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; font-size:22px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- storage (on-device, persists across sessions/app relaunch) ---------- */
const STORE_KEY = "ritual_habit_data_v1";
const POMO_KEY = "ritual_pomo_v1";

function loadData(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { habits: [{id:"seed1", name:"Drink water", icon:"droplet", color:"#6C8EFF", createdAt: fmt(new Date())}], completions: {} };
}
function saveData(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({habits: state.habits, completions: state.completions})); return true; }
  catch(e){ return false; }
}
function loadPomo(){
  try { const raw = localStorage.getItem(POMO_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return { task:"", duration:30 };
}
function savePomo(){
  try { localStorage.setItem(POMO_KEY, JSON.stringify({task: pomo.task, duration: pomo.duration})); } catch(e){}
}

/* ---------- helpers ---------- */
const PALETTE = ["#6C8EFF","#B57EDC","#E8956B","#5FD3A0","#F2C078","#EC6F8E"];
const ICONS = {dumbbell:"🏋️", sunrise:"🌅", briefcase:"💼", book:"📖", droplet:"💧", moon:"🌙",
  heart:"❤️", footprints:"👣", pen:"✍️", coffee:"☕", music:"🎵", leaf:"🌿"};
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmt(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === "style") Object.assign(e.style, attrs[k]);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === "class") e.className = attrs[k];
    else if (k === "disabled") e.disabled = !!attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => { if (c==null) return; e.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(c) : c); });
  return e;
}

/* ---------- state ---------- */
let state = loadData();
let pomo = loadPomo();
let ui = { tab:"habits", view:"week", showAdd:false, saveOk:true, timer:{ remaining: pomo.duration*60, running:false, interval:null } };

function persist(){ ui.saveOk = saveData(); render(); }

/* ---------- render root ---------- */
function render(){
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(Header());
  if (ui.tab === "habits") root.appendChild(HabitsView());
  else root.appendChild(PomodoroView());
  if (ui.tab === "habits") root.appendChild(Fab());
  root.appendChild(NavBar());
  if (ui.showAdd) root.appendChild(AddSheet());
}

function Header(){
  return el("div",{class:"header"},
    el("div",{class:"title"},"Ritual"),
    el("div",{class:"badge mono", style:{color: ui.saveOk?"#5FD3A0":"#EC6F8E", background: ui.saveOk?"#5FD3A01A":"#EC6F8E1A"}}, ui.saveOk?"saved on device":"save failed")
  );
}

function Fab(){
  return el("button",{class:"fab", onclick:()=>{ ui.showAdd=true; render(); }}, "+");
}

/* ---------- habits view ---------- */
function HabitsView(){
  const wrap = el("div");
  wrap.appendChild(el("div",{class:"tabs"},
    el("button",{class:"pill"+(ui.view==="week"?" active":""), onclick:()=>{ui.view="week"; render();}}, "📅 Week"),
    el("button",{class:"pill"+(ui.view==="grid"?" active":""), onclick:()=>{ui.view="grid"; render();}}, "▦ Year")
  ));
  if (state.habits.length === 0){
    wrap.appendChild(el("div",{class:"empty"},
      el("p",{},"No rituals yet. Start with one small, repeatable thing."),
      el("div",{style:{height:"14px"}}),
      el("button",{class:"btn-primary", onclick:()=>{ui.showAdd=true; render();}}, "Add your first ritual")
    ));
  } else {
    state.habits.forEach(h => wrap.appendChild(HabitCard(h)));
  }
  return wrap;
}

function computeStreak(habit){
  let streak=0; const d=new Date(); const map = state.completions[habit.id]||{};
  while(map[fmt(d)]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function HabitCard(habit){
  const map = state.completions[habit.id]||{};
  const today = fmt(new Date());
  const streak = computeStreak(habit);

  const card = el("div",{class:"card", style:{border:`1px solid ${habit.color}33`}});
  const head = el("div",{class:"card-head"});
  const info = el("div",{class:"habit-info"},
    el("span",{class:"icon-box", style:{background:habit.color+"22"}}, ICONS[habit.icon]||"⭐"),
    el("div",{},
      el("span",{class:"habit-name"}, habit.name),
      streak>0 ? el("span",{class:"streak mono", style:{color:habit.color, background:habit.color+"22"}}, `🔥 ${streak}`) : null
    )
  );
  const actions = el("div",{class:"row", style:{gap:"6px"}});
  if (ui.view==="grid"){
    const done = !!map[today];
    actions.appendChild(el("button",{class:"iconbtn", style:{background: done?habit.color:"transparent", border:`1.5px solid ${done?habit.color:"#2B2D38"}`, color: done?"#0B0C10":"#8A8C99"},
      onclick:()=>toggleDay(habit.id, today)}, done?"✓":"")); 
  }
  actions.appendChild(el("button",{class:"iconbtn", onclick:()=>confirmRemove(habit, card)}, "✕"));
  head.appendChild(info); head.appendChild(actions);
  card.appendChild(head);
  card.appendChild(ui.view==="week" ? WeekRow(habit) : YearGrid(habit));
  return card;
}

function confirmRemove(habit, card){
  if (card.querySelector(".confirm-row")) return;
  const row = el("div",{class:"confirm-row", style:{marginTop:"12px", padding:"10px 12px", borderRadius:"10px", background:"#1C1E27", display:"flex", justifyContent:"space-between", alignItems:"center"}},
    el("span",{style:{fontSize:"12px", color:"#8A8C99"}}, `Remove "${habit.name}" and its history?`),
    el("div",{style:{display:"flex", gap:"10px"}},
      el("button",{style:{background:"none",border:"none",color:"#F1EEE6",fontSize:"12px",cursor:"pointer"}, onclick:()=>{ row.remove(); }}, "Cancel"),
      el("button",{style:{background:"none",border:"none",color:"#EC6F8E",fontSize:"12px",cursor:"pointer"}, onclick:()=>removeHabit(habit.id)}, "Remove")
    )
  );
  card.appendChild(row);
}

function WeekRow(habit){
  const today = new Date();
  const days = [];
  for (let i=6;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); days.push(d); }
  const map = state.completions[habit.id]||{};
  const row = el("div",{class:"week"});
  days.forEach(d=>{
    const key = fmt(d); const done = !!map[key]; const isToday = key===fmt(today);
    row.appendChild(el("button",{class:"day", onclick:()=>toggleDay(habit.id,key)},
      el("span",{class:"wd mono"}, WD[d.getDay()]),
      el("span",{class:"dot mono", style:{background: done?habit.color:"transparent", borderColor: done?habit.color:(isToday?"#F1EEE6":"#2B2D38"), color: done?"#0B0C10":"#F1EEE6"}}, done?"✓":d.getDate())
    ));
  });
  return row;
}

function YearGrid(habit){
  const today = new Date(); const year = today.getFullYear();
  const jan1 = new Date(year,0,1); const startPad = jan1.getDay();
  const cursor = new Date(jan1); cursor.setDate(cursor.getDate()-startPad);
  const dec31 = new Date(year,11,31); const endPad = 6-dec31.getDay();
  const totalDays = Math.round((dec31-cursor)/86400000)+1+endPad;
  const map = state.completions[habit.id]||{};
  const wrap = el("div",{class:"yeargrid"});
  const inner = el("div",{class:"grid-inner"});
  for (let i=0;i<totalDays;i++){
    const d = new Date(cursor); d.setDate(cursor.getDate()+i);
    const key = fmt(d); const inYear = d.getFullYear()===year; const future = d>today; const done=!!map[key]; const isToday=key===fmt(today);
    inner.appendChild(el("div",{class:"cell", style:{
      background: !inYear ? "transparent" : done ? habit.color : future ? "#14151C" : "#1C1E27",
      boxShadow: isToday ? `0 0 0 1.5px ${habit.color}` : "none"
    }}));
  }
  wrap.appendChild(inner);
  return wrap;
}

function toggleDay(habitId, dateKey){
  const map = state.completions[habitId] || {};
  if (map[dateKey]) delete map[dateKey]; else map[dateKey] = true;
  state.completions[habitId] = map;
  persist();
}
function removeHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  delete state.completions[id];
  persist();
}
function addHabit(h){
  state.habits.push(h);
  persist();
}

/* ---------- add sheet ---------- */
function AddSheet(){
  let name="", icon="dumbbell", color=PALETTE[0];
  const backdrop = el("div",{class:"sheet-backdrop", onclick:(e)=>{ if(e.target===backdrop){ ui.showAdd=false; render(); } }});
  const sheet = el("div",{class:"sheet"});
  sheet.appendChild(el("div",{class:"row between", style:{marginBottom:"18px"}},
    el("div",{style:{fontSize:"17px", fontWeight:"700"}},"New ritual"),
    el("button",{style:{background:"none",border:"none",color:"#8A8C99",fontSize:"18px",cursor:"pointer"}, onclick:()=>{ui.showAdd=false; render();}},"✕")
  ));
  const input = el("input",{placeholder:"e.g. Read 10 pages", oninput:(e)=>{ name=e.target.value; submitBtn.disabled=!name.trim(); submitBtn.style.opacity = name.trim()?1:0.4; }});
  sheet.appendChild(input);
  sheet.appendChild(el("div",{class:"label"},"Icon"));
  const iconGrid = el("div",{class:"icongrid"});
  Object.keys(ICONS).forEach(k=>{
    const btn = el("button",{class:"icon-choice"+(k===icon?" sel":""), style:{color: k===icon?color:"#8A8C99"}, onclick:()=>{
      icon=k;
      [...iconGrid.children].forEach(c=>{c.classList.remove("sel"); c.style.color="#8A8C99";});
      btn.classList.add("sel"); btn.style.color=color;
    }}, ICONS[k]);
    iconGrid.appendChild(btn);
  });
  sheet.appendChild(iconGrid);
  sheet.appendChild(el("div",{class:"label"},"Color"));
  const colorRow = el("div",{class:"colorrow"});
  PALETTE.forEach(c=>{
    const sw = el("button",{class:"swatch", style:{background:c, boxShadow: c===color?`0 0 0 3px #14151C, 0 0 0 5px ${c}`:"none"}, onclick:()=>{
      color=c;
      [...colorRow.children].forEach(s=>s.style.boxShadow="none");
      sw.style.boxShadow = `0 0 0 3px #14151C, 0 0 0 5px ${c}`;
    }});
    colorRow.appendChild(sw);
  });
  sheet.appendChild(colorRow);
  const submitBtn = el("button",{class:"btn-primary", style:{width:"100%", padding:"14px", fontSize:"14px", opacity:"0.4"}, disabled:true, onclick:()=>{
    if(!name.trim()) return;
    addHabit({id:"h_"+Date.now(), name:name.trim(), icon, color, createdAt: fmt(new Date())});
    ui.showAdd=false; render();
  }}, "Add ritual");
  sheet.appendChild(submitBtn);
  backdrop.appendChild(sheet);
  return backdrop;
}

/* ---------- pomodoro ---------- */
function PomodoroView(){
  const wrap = el("div",{class:"pomo-wrap"});
  wrap.appendChild(el("div",{class:"pomo-title"},"Focus session"));
  wrap.appendChild(el("div",{class:"pomo-sub"},"One task, one block of quiet time."));
  wrap.appendChild(el("input",{class:"pomo-input", placeholder:"What are you focusing on?", value:pomo.task, oninput:(e)=>{ pomo.task=e.target.value; savePomo(); }}));

  const totalSecs = pomo.duration*60;
  const pct = 1 - ui.timer.remaining/totalSecs;
  const mm = String(Math.floor(ui.timer.remaining/60)).padStart(2,"0");
  const ss = String(ui.timer.remaining%60).padStart(2,"0");
  const ring = el("div",{class:"ring", style:{background:`conic-gradient(#F2C078 ${pct*360}deg, #1C1E27 0deg)`}},
    el("div",{class:"ring-inner"},
      el("div",{class:"ring-time mono"}, `${mm}:${ss}`),
      el("div",{class:"ring-status"}, ui.timer.running?"focusing…": ui.timer.remaining===0?"done":"paused")
    )
  );
  wrap.appendChild(ring);

  const durRow = el("div",{class:"durrow"});
  [15,30,45,60].forEach(m=>{
    durRow.appendChild(el("button",{class:"dur mono", style:{background: pomo.duration===m?"#F2C078":"#14151C", color: pomo.duration===m?"#0B0C10":"#8A8C99", border:`1px solid ${pomo.duration===m?"#F2C078":"#23252F"}`}, onclick:()=>{
      pomo.duration=m; ui.timer.remaining=m*60; ui.timer.running=false; clearInterval(ui.timer.interval); savePomo(); render();
    }}, m+"m"));
  });
  wrap.appendChild(durRow);

  const controls = el("div",{class:"controls"});
  controls.appendChild(el("button",{class:"ctrl-side", onclick:()=>{ ui.timer.remaining=pomo.duration*60; ui.timer.running=false; clearInterval(ui.timer.interval); render(); }}, "↺"));
  controls.appendChild(el("button",{class:"ctrl-main", disabled: ui.timer.remaining===0, style:{opacity: ui.timer.remaining===0?0.4:1}, onclick:()=>{
    ui.timer.running = !ui.timer.running;
    if (ui.timer.running){
      ui.timer.interval = setInterval(()=>{
        ui.timer.remaining--;
        if (ui.timer.remaining<=0){ ui.timer.remaining=0; ui.timer.running=false; clearInterval(ui.timer.interval); }
        render();
      },1000);
    } else clearInterval(ui.timer.interval);
    render();
  }}, ui.timer.running?"❚❚":"▶"));
  controls.appendChild(el("div",{style:{width:"44px"}}));
  wrap.appendChild(controls);
  return wrap;
}

/* ---------- nav bar ---------- */
function NavBar(){
  return el("div",{class:"navbar"},
    el("div",{class:"navinner"},
      el("button",{class:"navbtn"+(ui.tab==="habits"?" active":""), onclick:()=>{ui.tab="habits"; render();}}, el("span",{class:"navicon"},"📅"), el("span",{},"Habits")),
      el("button",{class:"navbtn"+(ui.tab==="pomodoro"?" active":""), onclick:()=>{ui.tab="pomodoro"; render();}}, el("span",{class:"navicon"},"⏱️"), el("span",{},"Pomodoro"))
    )
  );
}

render();
</script>
</body>
</html>
